services:
  - type: web
    name: turbo-executions
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: ACCESS_CODE
        sync: false  # Set this in Render dashboard
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 8000
      - key: MOCK_MODE
        value: "1"  # Use mock mode since MT5 won't be available
